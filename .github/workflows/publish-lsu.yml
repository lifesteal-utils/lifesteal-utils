name: Publish Lifesteal Utils

on:
  push:
    branches:
      - main
      - beta

permissions:
  contents: read

concurrency:
  group: publish-lsu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build all Minecraft versions
    runs-on: ubuntu-latest
    outputs:
      artifact-version: ${{ steps.release.outputs.artifact_version }}
      release-version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      publish-matrix: ${{ steps.release.outputs.matrix }}

    defaults:
      run:
        working-directory: apps/lsu

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          cache-dependency-path: apps/lsu/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine release metadata and publish matrix
        id: release
        shell: python
        run: |
          import json
          import os
          import tomllib

          with open("stonecutter.properties.toml", "rb") as source:
              config = tomllib.load(source)

          base_version = config["mod"]["version"]
          if not base_version:
              raise SystemExit("mod.version must not be empty")

          channel = "beta" if os.environ["GITHUB_REF_NAME"] == "beta" else "release"
          version = f"{base_version}-beta.{os.environ['GITHUB_RUN_NUMBER']}" if channel == "beta" else base_version

          include = []
          for minecraft, properties in config.items():
              if minecraft in ("mod", "deps"):
                  continue
              targets = properties["mod"]["mc_targets"].split()
              if not targets:
                  raise SystemExit(f"mod.mc_targets must not be empty for Minecraft {minecraft}")
              include.append({"minecraft": minecraft, "game_versions": "\n".join(targets)})

          if not include:
              raise SystemExit("No Minecraft versions configured for publishing")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"artifact_version={base_version}\n")
              output.write(f"version={version}\n")
              output.write(f"channel={channel}\n")
              output.write(f"matrix={json.dumps({'include': include})}\n")

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and collect release jars
        run: ./gradlew buildAndCollect -x test --stacktrace

      - name: Upload release jars
        uses: actions/upload-artifact@v4
        with:
          name: lifesteal-utils-${{ steps.release.outputs.version }}
          path: apps/lsu/build/libs/${{ steps.release.outputs.artifact_version }}/*.jar
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish for Minecraft ${{ matrix.minecraft }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.publish-matrix) }}

    steps:
      - name: Download release jars
        uses: actions/download-artifact@v4
        with:
          name: lifesteal-utils-${{ needs.build.outputs.release-version }}
          path: release

      - name: Locate Minecraft version artifacts
        id: artifacts
        shell: bash
        env:
          MC_VERSION: ${{ matrix.minecraft }}
        run: |
          shopt -s nullglob
          primary=(release/*+"${MC_VERSION}".jar)
          sources=(release/*+"${MC_VERSION}"-sources.jar)

          if [[ ${#primary[@]} -ne 1 || ${#sources[@]} -ne 1 ]]; then
            echo "Expected exactly one primary jar and one sources jar for Minecraft ${MC_VERSION}." >&2
            find release -maxdepth 1 -type f -print >&2
            exit 1
          fi

          echo "primary=${primary[0]}" >> "$GITHUB_OUTPUT"
          echo "primary_name=$(basename "${primary[0]}")" >> "$GITHUB_OUTPUT"
          echo "sources=${sources[0]}" >> "$GITHUB_OUTPUT"
          echo "sources_name=$(basename "${sources[0]}")" >> "$GITHUB_OUTPUT"

      - name: Publish to Modrinth
        uses: cloudnode-pro/modrinth-publish@v2.5.0
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: gkfOQk9U
          name: ${{ needs.build.outputs.artifact-version }}
          version: ${{ needs.build.outputs.release-version }}+${{ matrix.minecraft }}
          channel: ${{ needs.build.outputs.channel }}
          changelog: ${{ github.event.head_commit.message }}
          loaders: fabric
          game-versions: ${{ matrix.game_versions }}
          environment: client_only
          files: |-
            ${{ steps.artifacts.outputs.primary }}
            ${{ steps.artifacts.outputs.sources }}
          primary-file: ${{ steps.artifacts.outputs.primary_name }}
          file-types: ${{ steps.artifacts.outputs.sources_name }}=sources-jar
          dependencies: '[{"project_id":"P7dR8mSH","dependency_type":"required"},{"project_id":"mOgUt4GM","dependency_type":"optional"},{"project_id":"O5VsIpQY","dependency_type":"embedded"}]'
